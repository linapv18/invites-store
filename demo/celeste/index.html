<style>
/* Celeste: noche estrellada. Los colores salen de estas variables (paletas en demo/shared/content.js). */
:root{
  --bg:#0B1430;--bg2:#131F48;--ink:#EEF1FA;--silver:#C9D2E6;--moon:#F4E9C8;--accent:#8FA7E0;--neb1:#3A4C9A;--neb2:#7A4C9A;--soft:#E4E9F7dd;
  /* Panel de los novios y música (demo/shared/panel.css) */
  --p-bg:#EEF1FA;--p-surface:#FFFFFF;--p-ink:var(--bg);--p-muted:#5B6585;--p-line:#C9D2E6;--p-accent:var(--bg);--p-on-accent:var(--moon);
  --p-serif:Italiana,Georgia,serif;--p-sans:'Tenor Sans',Helvetica,sans-serif;--m-bg:var(--bg2);--m-fg:var(--moon);--m-border:#ffffff44
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Spectral,Georgia,serif;font-weight:300;color:var(--ink);background-color:var(--bg)}
body.locked{overflow:hidden}
h1,h2,h3,p,blockquote{margin:0}
img{display:block;max-width:100%}
a{color:inherit}
button{font-family:inherit}
details summary{list-style:none;cursor:pointer}
details summary::-webkit-details-marker{display:none}
a:focus-visible,button:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--moon);outline-offset:3px}
.ph-img{width:100%;height:100%;object-fit:cover}
.in-w{position:relative;max-width:560px;margin:0 auto}
.it{font-family:Italiana,serif}
.tn{font:400 11px 'Tenor Sans',sans-serif;letter-spacing:.32em;text-transform:uppercase;color:var(--accent)}
.sky,body{background-image:var(--st1),var(--st2),radial-gradient(ellipse at 15% 8%,color-mix(in srgb,var(--neb1),transparent 55%),transparent 50%),radial-gradient(ellipse at 90% 55%,color-mix(in srgb,var(--neb2),transparent 62%),transparent 55%),radial-gradient(ellipse at 35% 100%,#1C6E8A40,transparent 60%);background-size:320px,520px,100% 100%,100% 100%,100% 100%;background-attachment:fixed}
.sky{background-color:var(--bg)}
.silver{background:linear-gradient(110deg,#9AA6C2,#FFFFFF 30%,#B9C3DB 45%,#F4F6FF 55%,#8E9AB8 70%,#E6EBF7 85%,#9AA6C2);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:mShine 7s ease-in-out infinite alternate}
@keyframes mShine{to{background-position:100% 0}}
.sec{position:relative;padding:68px 24px;text-align:center}
.sec h2{font:400 clamp(34px,5vw,42px)/1.1 Italiana,serif;letter-spacing:.04em;margin:12px 0 14px}
.sec p{font-size:16.5px;line-height:1.8;color:var(--soft)}
.glass{background:linear-gradient(160deg,#ffffff14,#ffffff06);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid #ffffff26;border-radius:22px;box-shadow:inset 0 1px 0 #ffffff22,0 20px 40px -24px #000c}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 26px;border:1px solid #ffffff66;border-radius:999px;background:linear-gradient(#ffffff26,#ffffff0a);color:var(--ink);font:400 11px 'Tenor Sans';letter-spacing:.24em;text-transform:uppercase;text-decoration:none;cursor:pointer;box-shadow:0 0 24px #9FB6FF33}
.twk{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.twk span{position:absolute;width:var(--s);height:var(--s);opacity:0;animation:tw var(--du) ease-in-out var(--de) infinite}
.twk svg{display:block;width:100%;height:100%}
@keyframes tw{0%,100%{opacity:0;transform:scale(.2) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.shoot{position:absolute;width:130px;height:1.5px;background:linear-gradient(90deg,transparent,#fff);border-radius:2px;pointer-events:none;opacity:0;rotate:28deg;filter:drop-shadow(0 0 4px #fff);animation:shoot var(--du,9s) ease-in var(--de,0s) infinite}
@keyframes shoot{0%{opacity:0;transform:translateX(-160px)}2%{opacity:1}9%{opacity:0;transform:translateX(320px)}100%{opacity:0;transform:translateX(320px)}}
.moonball{border-radius:50%;background:radial-gradient(circle at 36% 32%,#ffffff1f,transparent 45%),radial-gradient(circle at 50% 50%,transparent 58%,#2a24183d 88%,#1a160e70),var(--moonimg) center/cover,#E6E1D3;box-shadow:0 0 34px #F4E9C855,0 0 90px #F4E9C82b,inset -6px -8px 18px #00000038}
.phases{display:flex;justify-content:center;gap:9px}
.phases i{width:12px;height:12px;border-radius:50%;background:var(--moon);box-shadow:inset var(--x) 0 0 0 var(--bg),0 0 6px #F4E9C855}
@keyframes mGlow{to{box-shadow:0 0 60px #F4E9C899,0 0 120px #F4E9C844}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Apertura: luna y constelación ---------- */
.opening{position:fixed;inset:0;z-index:60;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px;text-align:center;transition:opacity .9s,visibility 0s .9s,transform .9s,filter .9s}
.opening>*{position:relative}
.opening>.twk,.opening>.shoot{position:absolute}
.opening.gone{opacity:0;visibility:hidden;pointer-events:none}
.opening.warp{transform:scale(1.7);filter:blur(6px);opacity:0}
.moonbtn{width:96px;height:96px;flex:none;border:0;padding:0;cursor:pointer;animation:mGlow 3s ease-in-out infinite alternate;transition:transform .8s cubic-bezier(.4,0,.2,1)}
.lit .moonbtn{transform:scale(.62) translateY(-10px)}
.constel{width:250px;height:230px;flex:none;margin:-6px 0}
.constel .ln{fill:none;stroke:#DDE5FF;stroke-width:.9;stroke-dasharray:1;stroke-dashoffset:1;opacity:.85;transition:stroke-dashoffset 2.2s cubic-bezier(.5,0,.3,1)}
.constel circle{fill:#fff;opacity:.45;filter:drop-shadow(0 0 3px #fff);transition:opacity .6s}
.lit .constel .ln{stroke-dashoffset:0}
.lit .constel circle{opacity:1}
.constel .ini{opacity:0;transition:opacity 1.2s 1.6s}
.lit .constel .ini{opacity:1}
.told{opacity:0;max-height:0;overflow:hidden;transition:opacity 1s,max-height 1s}
.lit .told{opacity:1;max-height:280px;transition-delay:1.8s}
.ask{transition:opacity .5s,max-height .5s;max-height:120px}
.lit .ask{opacity:0;max-height:0;overflow:hidden}
.told .cl{text-transform:lowercase}
@media (max-height:720px){.constel{width:200px;height:184px}.opening{gap:8px}}

/* ---------- Invitación ---------- */
.mbar{position:fixed;z-index:50;left:max(10px,calc(50% - 290px));right:max(10px,calc(50% - 290px));top:10px;height:48px;padding:0 20px;border-radius:999px;display:flex;align-items:center;justify-content:space-between;opacity:0;transform:translateY(-70px);transition:opacity .5s,transform .6s cubic-bezier(.22,1,.36,1);pointer-events:none;background:#ffffff14;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px #ffffff30,0 10px 24px -14px #000}
.mbar.show{opacity:1;transform:none}
.hero{position:relative;padding:70px 24px 60px;text-align:center;overflow:hidden}
.aurora{position:absolute;left:-40%;right:-40%;top:-60px;height:320px;pointer-events:none;background:linear-gradient(100deg,transparent 15%,color-mix(in srgb,var(--accent),transparent 45%) 32%,#7FE0C855 45%,color-mix(in srgb,var(--neb2),transparent 40%) 60%,transparent 78%);filter:blur(36px);opacity:.55;animation:aur 14s ease-in-out infinite alternate}
@keyframes aur{0%{transform:translateX(-12%) skewY(-7deg)}100%{transform:translateX(12%) skewY(5deg)}}
.orbit{position:relative;width:280px;height:280px;margin:18px auto 14px}
.orbit .pic{position:absolute;inset:40px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px #ffffff55,0 0 50px #F4E9C855,0 0 120px #8FA7E033}
.orbit .pic img{position:relative;height:124%;top:-12%;filter:saturate(.85) contrast(1.05)}
.ring{position:absolute;inset:0;border-radius:50%;border:1px solid #ffffff2a;animation:spin var(--du) linear infinite}
.ring::after{content:"";position:absolute;top:50%;left:-4px;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.ring.r2{inset:16px;border-style:dashed;border-color:#ffffff1c;animation-direction:reverse}
.ring.r2::after{left:auto;right:-3px;width:6px;height:6px}
.hero h1{font:400 clamp(58px,8vw,72px)/1 Italiana,serif;letter-spacing:.02em}
.hero h1 .amp{display:block;font:italic 300 24px Spectral;color:var(--moon);margin:4px 0}
.hero .date{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:16px;font:400 13px 'Tenor Sans';letter-spacing:.28em}
.star4{display:inline-block;width:9px;height:9px;background:var(--moon);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.hero .msg{margin-top:16px;font:italic 300 19px/1.5 Spectral}
.hero .in-w>*{position:relative}
.planets{position:relative;height:250px;margin-top:20px}
.planets svg{position:absolute;inset:0;width:100%;height:100%}
.planets .p{position:absolute;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px #ffffff44,0 0 26px #8FA7E055}
.planets .p:nth-of-type(1){width:118px;height:118px;left:4%;top:70px}
.planets .p:nth-of-type(2){width:92px;height:92px;left:40%;top:6px}
.planets .p:nth-of-type(3){width:104px;height:104px;right:2%;top:120px}
.planets .p:nth-of-type(n+4){display:none}
.moons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:28px auto 0;max-width:440px}
.moons>div{display:flex;flex-direction:column;align-items:center;gap:10px}
.moons .moonball{width:66px;height:66px;display:grid;place-items:center;animation:mGlow 3s ease-in-out infinite alternate}
.moons>div:nth-child(2) .moonball{animation-delay:-.8s}.moons>div:nth-child(3) .moonball{animation-delay:-1.6s}.moons>div:nth-child(4) .moonball{animation-delay:-2.4s}
.moons b{font:400 26px Italiana;color:#1B2348;text-shadow:0 0 6px #F4EFE2,0 0 2px #F4EFE2;font-variant-numeric:tabular-nums}
.moons span{font:400 9px 'Tenor Sans';letter-spacing:.24em;text-transform:uppercase;color:var(--silver)}
.tl{position:relative;margin-top:24px;text-align:left;padding-left:44px}
.tl svg.line{position:absolute;left:12px;top:6px;height:calc(100% - 20px);width:12px;overflow:visible}
.tl>div{position:relative;padding-bottom:26px}
.tl>div::before{content:"";position:absolute;left:-40px;top:4px;width:16px;height:16px;background:var(--moon);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);filter:drop-shadow(0 0 6px #fff);animation:pulseS 2.4s ease-in-out infinite alternate}
@keyframes pulseS{to{transform:scale(1.3) rotate(45deg)}}
.tl .tm{font:400 11px 'Tenor Sans';letter-spacing:.26em;color:var(--accent);text-transform:uppercase}
.tl h3{font:400 28px Italiana;margin:4px 0}
.sec .tl p{font-size:15px;line-height:1.6}
.tl a{display:inline-block;margin-top:6px;font:400 10px 'Tenor Sans';letter-spacing:.22em;color:var(--moon);text-decoration:none;border-bottom:1px solid #F4E9C866;padding-bottom:3px}
.gc{padding:30px 22px;margin-top:18px}
.planetchips{display:flex;justify-content:center;gap:12px;margin-top:14px}
.planetchips i{width:30px;height:30px;border-radius:50%;background-image:radial-gradient(circle at 35% 30%,#ffffffcc,transparent 45%);box-shadow:0 0 14px #ffffff55}
.lz-content .planetchips{display:none}
.gcs{display:flex;flex-direction:column;gap:14px;margin-top:22px;text-align:left}
.gcs>div{padding:24px 22px}
.gcs svg{color:var(--moon)}
.gcs h3{font:400 24px Italiana;margin:8px 0 6px}
.sec .gcs p{font-size:15px;line-height:1.65}
.gcs b{font-weight:400;color:#fff}
blockquote{margin:6px 0 12px;font:400 30px/1.3 Italiana,serif}
.cst{position:absolute;width:110px;pointer-events:none;opacity:.8;z-index:0}
.cst line{stroke:#DDE5FF;stroke-width:.7;stroke-opacity:.55}
.cst circle{fill:#fff;filter:drop-shadow(0 0 3px #fff)}
.faq{text-align:left;margin-top:16px}
.faq details{border-bottom:1px solid #ffffff22}
.faq summary{display:flex;justify-content:space-between;gap:12px;padding:17px 0;font:400 18px Spectral}
.faq summary::after{content:"";flex:none;width:12px;height:12px;margin-top:5px;background:var(--moon);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);transition:rotate .4s}
.faq details[open] summary::after{rotate:45deg}
.sec .faq p{font-size:15px;padding-bottom:16px}
.person{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:13px 0;border-bottom:1px solid #ffffff1c;text-align:left}
.person span{font:400 17px Spectral}
.person>div{display:flex;gap:6px;flex:none}
.person button{min-height:36px;padding:7px 12px;border:1px solid #ffffff55;border-radius:999px;background:none;color:var(--ink);font:400 10px 'Tenor Sans';letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.person button[aria-pressed=true]{background:var(--moon);border-color:var(--moon);color:#1B2348;box-shadow:0 0 14px #F4E9C888}
label{display:block;text-align:left;font:400 10px 'Tenor Sans';letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-top:18px}
textarea{width:100%;margin-top:8px;border:1px solid #ffffff2a;border-radius:12px;background:#ffffff0d;padding:10px;font:300 16px Spectral;color:var(--ink);resize:none}
.rs-err{margin-top:14px;font-size:14px;color:var(--moon)}
.wish{position:fixed;z-index:70;width:110px;height:1.5px;border-radius:2px;background:linear-gradient(90deg,transparent,#fff);filter:drop-shadow(0 0 4px #fff);pointer-events:none;transform-origin:0 50%}
footer{position:relative;padding:64px 20px 120px;text-align:center}

/* ---------- Movimiento ---------- */
[data-rv]{opacity:0;transform:translateY(26px);transition:opacity .9s ease,transform 1s cubic-bezier(.22,1,.36,1)}
[data-rv].in,.lz-editor [data-rv]{opacity:1;transform:none}
.draw path,.draw line{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 2s cubic-bezier(.5,0,.3,1)}
.draw.in path,.draw.in line{stroke-dashoffset:0}
.letters b{display:inline-block;font-weight:inherit;opacity:0;filter:blur(8px);transform:translateY(16px) scale(1.4);transition:opacity .9s,filter .9s,transform .9s cubic-bezier(.22,1,.36,1);transition-delay:calc(var(--i) * 90ms + .2s)}
.letters.in b{opacity:1;filter:none;transform:none}
@media (min-width:700px){.sec{padding-left:40px;padding-right:40px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}[data-rv]{opacity:1;transform:none}.draw path,.draw line{stroke-dashoffset:0}.letters b{opacity:1;filter:none;transform:none}.twk,.shoot{display:none}}
</style>

  var S = window.CelesteS, $ = function (id) { return document.getElementById(id); };
  var PEOPLE = ['Carlos Rodríguez', 'Lucía Pérez', 'Sofía Rodríguez', 'Mateo Rodríguez'];
  LazoPanel.init({ mono: 'A&L', couple: S.n1 + ' ' + S.y + ' ' + S.n2, link: location.pathname, guest: S.guest, people: PEOPLE });
  LazoMusic.init({ src: '/assets/musica/demo.mp3' });
  var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Nombres letra por letra: se copian de las fuentes que llena el editor.
  function copy() { document.querySelectorAll('[data-split]').forEach(function (el) { var t = $(el.dataset.split).textContent.trim(); if (el._t !== t) { el._t = t; el.innerHTML = window.CelesteSplit(t, +(el.dataset.off || 0)); } }); }
  copy();
  ['srcN1', 'srcN2'].forEach(function (id) { new MutationObserver(copy).observe($(id), { childList: true, characterData: true, subtree: true }); });

  // Lo que aparece, se dibuja o se escribe al llegar a la pantalla (después de abrir la invitación).
  var io = null;
  function observe(root) { if (io) root.querySelectorAll('[data-rv]:not(.in), .draw:not(.in), .letters:not(.in)').forEach(function (el) { if (!el.closest('.opening')) io.observe(el); }); }
  function watch() {
    if (io) return;
    if (!('IntersectionObserver' in window)) { document.querySelectorAll('#invite [data-rv], #invite .draw, #invite .letters').forEach(function (el) { el.classList.add('in'); }); return; }
    io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }); }, { threshold: .18 });
    observe(document);
  }
  document.addEventListener('lz-render', function (e) { observe(e.target); });

  // Barra con los nombres al bajar, y la foto de portada que se mueve más lento (profundidad).
  var bar = $('mbar'), img = $('heroImg'), raf = 0, opened = false;
  window.addEventListener('scroll', function () {
    if (raf) return;
    raf = requestAnimationFrame(function () { raf = 0; var y = window.pageYOffset; bar.classList.toggle('show', opened && y > 520); if (y < 900) img.style.translate = '0 ' + Math.min(y * .06, img.parentNode.clientHeight * .12).toFixed(1) + 'px'; });
  }, { passive: true });

  // Apertura: al tocar la luna las estrellas se unen en un corazón; al entrar, el cielo se abre.
  var op = $('open'), timer = null;
  $('moon').addEventListener('click', function () {
    if (op.classList.contains('lit')) return;
    LazoMusic.play(); op.classList.add('lit'); $('enter').tabIndex = 0;
    setTimeout(function () { $('enter').focus({ preventScroll: true }); }, 1900);
  });
  function enter() { clearTimeout(timer); opened = true; op.classList.add('gone'); document.body.classList.remove('locked'); setTimeout(watch, 350); }
  $('enter').addEventListener('click', function () { op.classList.add('warp'); timer = setTimeout(function () { enter(); $('demoBar').hidden = false; window.scrollTo(0, 0); }, 700); });

  // Para el editor de Lazo (demo/shared/content.js): saltar o volver a mostrar la luna.
  window.LzTemplate = {
    open: function () { op.classList.add('lit'); enter(); },
    envelope: function () { clearTimeout(timer); opened = false; bar.classList.remove('show'); op.classList.remove('gone', 'lit', 'warp'); $('enter').tabIndex = -1; document.body.classList.add('locked'); window.scrollTo(0, 0); },
    scroll: function (el, now) { window.scrollTo({ top: el.getBoundingClientRect().top + window.pageYOffset - 70, behavior: now ? 'instant' : 'smooth' }); }
  };

  // Cuenta regresiva en cuatro lunas (la fecha del editor llega en window.LZ_T)
  var TARGET = new Date(2027, 2, 14, 13, 0).getTime(), pad = function (n) { return String(n).padStart(2, '0'); }, cd = {};
  document.querySelectorAll('[data-cd]').forEach(function (e) { cd[e.dataset.cd] = e; });
  function tick() { var s = Math.floor(Math.max(0, (window.LZ_T || TARGET) - Date.now()) / 1000); cd.d.textContent = pad(Math.floor(s / 86400)); cd.h.textContent = pad(Math.floor(s / 3600) % 24); cd.m.textContent = pad(Math.floor(s / 60) % 60); cd.s.textContent = pad(s % 60); }
  tick(); setInterval(tick, 1000);

  // Confirmación por persona (demo: no se envía a ningún lado); al confirmar cruzan estrellas fugaces.
  function wishes(x, y) {
    if (still) return;
    for (var i = 0; i < 9; i++) {
      var s = document.createElement('i'), a = -Math.PI / 2 + (i - 4) * .28, d = 220 + Math.random() * 120, deg = a * 180 / Math.PI;
      s.className = 'wish'; s.style.left = x + 'px'; s.style.top = y + 'px'; document.body.appendChild(s);
      s.animate([{ transform: 'rotate(' + deg + 'deg) translateX(0) scaleX(.2)', opacity: 0 }, { opacity: 1, offset: .2 }, { transform: 'rotate(' + deg + 'deg) translateX(' + d + 'px) scaleX(1)', opacity: 0 }], { duration: 1100 + i * 60, delay: i * 70, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'backwards' }).onfinish = (function (n) { return function () { n.remove(); }; })(s);
    }
  }
  var att = PEOPLE.map(function () { return null; }), wrap = $('people');
  PEOPLE.forEach(function (name, i) {
    var row = document.createElement('div'); row.className = 'person'; row.setAttribute('role', 'group'); row.setAttribute('aria-label', name);
    var n = document.createElement('span'); n.textContent = name;
    var g = document.createElement('div');
    [[S.yes, true], [S.no, false]].forEach(function (o) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = o[0]; b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', function () { att[i] = o[1]; g.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); $('rsErr').hidden = true; });
      g.appendChild(b);
    });
    row.appendChild(n); row.appendChild(g); wrap.appendChild(row);
  });
  $('rsSave').addEventListener('click', function () {
    if (att.some(function (x) { return x === null; })) { $('rsErr').hidden = false; return; }
    var r = this.getBoundingClientRect(); wishes(r.left + r.width / 2, r.top);
    $('rsSum').textContent = S.will(att.filter(Boolean).length, PEOPLE.length);
    $('rsForm').hidden = true; $('rsDone').hidden = false;
    LazoPanel.setResponse(att, $('note').value.trim());
  });
  $('rsEdit').addEventListener('click', function () { $('rsDone').hidden = true; $('rsForm').hidden = false; });
})();
</script>
</body>
</html>
