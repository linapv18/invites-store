<style>
/* Fiesta: papel picado y lotería. Los colores salen de estas variables (paletas en demo/shared/content.js). */
:root{
  --bg:#FFF3DF;--ink:#2A1B3D;--pink:#E8457C;--orange:#F28C28;--yellow:#F6C343;--teal:#19A39A;--blue:#3B5BDB;--green:#57A639;--red:#D7263D;

  /* Panel de los novios y música (demo/shared/panel.css) */
  --p-bg:var(--bg);--p-surface:#FFFBF1;--p-ink:var(--ink);--p-muted:color-mix(in srgb,var(--ink) 65%,transparent);--p-line:color-mix(in srgb,var(--ink) 18%,transparent);--p-accent:var(--pink);--p-on-accent:#fff;
  --p-serif:'Alfa Slab One',Georgia,serif;--p-sans:Nunito,Helvetica,sans-serif;--m-bg:var(--pink);--m-fg:#fff;--m-border:var(--ink)
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Nunito,Helvetica,sans-serif;color:var(--ink);background-color:var(--bg);background-image:var(--grain),var(--mottle);background-blend-mode:multiply}
body.locked{overflow:hidden}
h1,h2,h3,p{margin:0}
img{display:block;max-width:100%}
a{color:inherit}
button{font-family:inherit}
details summary{list-style:none;cursor:pointer}
details summary::-webkit-details-marker{display:none}
a:focus-visible,button:focus-visible,summary:focus-visible,textarea:focus-visible,.lcard:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.ph-img{width:100%;height:100%;object-fit:cover}
.in-w{position:relative;max-width:560px;margin:0 auto}
.slab{font-family:'Alfa Slab One',serif;font-weight:400}
.pac{font-family:Pacifico,cursive;font-weight:400}
.eb{font:900 11px Nunito;letter-spacing:.22em;text-transform:uppercase;color:var(--pink)}
.papel{background-color:var(--bg);background-image:var(--grain),var(--mottle);background-blend-mode:multiply}
.sec{padding:60px 22px;text-align:center;position:relative;overflow:hidden}
.sec h2{font:400 clamp(34px,5vw,42px)/1.05 'Alfa Slab One',serif;margin:10px 0 14px;text-shadow:3px 3px 0 var(--yellow)}
.sec p{font-size:16px;line-height:1.7}
.btn{display:inline-flex;gap:8px;align-items:center;justify-content:center;padding:15px 24px;border:2.5px solid var(--ink);border-radius:999px;background:var(--pink);color:#fff;font:900 13px Nunito;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .15s,box-shadow .15s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.sarape{position:relative;height:30px;background-image:var(--grain),repeating-linear-gradient(90deg,#0000000d 0 1px,transparent 1px 3px),linear-gradient(180deg,var(--pink) 0 4px,var(--orange) 4px 8px,var(--yellow) 8px 13px,var(--ink) 13px 14px,var(--teal) 14px 19px,var(--bg) 19px 20px,var(--blue) 20px 23px,var(--green) 23px 27px,var(--red) 27px 30px);background-blend-mode:multiply,normal,normal}
.picado{position:relative;pointer-events:none}
.picado svg.str{position:absolute;left:0;top:0;width:100%;overflow:visible}
.flag{position:absolute;width:42px;height:50px;transform-origin:50% 0;-webkit-mask:var(--fm) center/100% 100% no-repeat;mask:var(--fm) center/100% 100% no-repeat;background-color:var(--c);background-image:var(--grain),linear-gradient(#ffffff30,transparent);background-blend-mode:multiply,normal;animation:flut var(--du) ease-in-out var(--de) infinite alternate}
@keyframes flut{0%{transform:perspective(200px) rotateX(-10deg) skewX(-3deg)}50%{transform:perspective(200px) rotateX(26deg) skewX(4deg)}100%{transform:perspective(200px) rotateX(4deg) skewX(-1deg)}}

/* ---------- Apertura: carta de lotería ---------- */
.opening{position:fixed;inset:0;z-index:60;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px 20px 60px;text-align:center;transition:opacity .8s,visibility 0s .8s}
.opening.gone{opacity:0;visibility:hidden;pointer-events:none}
.opening>.picado{position:absolute;left:0;right:0;transition:transform 1s cubic-bezier(.6,-.3,.4,1)}
.opening>.pc1{top:4px}.opening>.pc2{top:62px;transition-delay:.12s}.opening>.pc3{bottom:-14px;transition-delay:.06s}
.party>.pc1,.party>.pc2{transform:translateY(-260px)}
.party>.pc3{transform:translateY(220px)}
.lcard{position:relative;width:220px;height:316px;flex:none;perspective:1100px;cursor:pointer;margin-top:4px;border-radius:10px}
.lin{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.4,0,.2,1)}
.flip .lin{transform:rotateY(180deg)}
.lface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--ink);border-radius:10px;padding:10px;box-shadow:6px 6px 0 var(--ink);background-color:#FFFBF1;background-image:var(--grain);background-blend-mode:multiply;display:flex;flex-direction:column}
.lback{transform:rotateY(180deg);align-items:center;justify-content:center;text-align:center;padding:18px 16px;background-color:var(--yellow)}
.lback .btn{padding:11px 12px;font-size:11px;letter-spacing:.03em;white-space:nowrap}
.lart{position:relative;flex:1;border:2px solid var(--ink);border-radius:4px;overflow:hidden;background:radial-gradient(circle at 50% 48%,#FFE6A8,#F6C343 60%,#F28C28)}
.lart .num{position:absolute;left:6px;top:4px;font:400 26px 'Alfa Slab One';color:var(--ink);z-index:1}
.lart svg{position:absolute;inset:0;width:100%;height:100%}
.ltitle{margin-top:8px;font:400 22px 'Alfa Slab One';text-align:center;letter-spacing:.04em}
.forline{font:800 14px Nunito;text-align:center;background:#fff;border:2px solid var(--ink);border-radius:99px;padding:6px 14px;box-shadow:3px 3px 0 var(--ink)}
.rays{transform-origin:50px 56px;animation:spin 24s linear infinite}
.flame{transform-origin:50px 36px;animation:flick .5s ease-in-out infinite alternate}
@keyframes flick{to{transform:scaleY(1.12) scaleX(.94)}}
@keyframes spin{to{transform:rotate(360deg)}}
.wiggle{animation:wig 2.2s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.hint{min-height:28px;font-size:18px;color:var(--teal)}
.conf{position:fixed;z-index:70;pointer-events:none;border-radius:1px}
@media (max-height:700px){.lcard{scale:.88;margin:-16px 0}.opening>.pc2{display:none}}

/* ---------- Invitación ---------- */
.mbar{position:fixed;z-index:50;left:max(10px,calc(50% - 290px));right:max(10px,calc(50% - 290px));top:10px;height:48px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;opacity:0;transform:translateY(-70px);transition:opacity .5s,transform .6s cubic-bezier(.22,1,.36,1);pointer-events:none;background:var(--yellow);border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);border-radius:14px}
.mbar.show{opacity:1;transform:none}
.hero{position:relative;padding:100px 22px 54px;text-align:center;overflow:hidden}
.hero>.picado{position:absolute;left:0;right:0;top:0}
.lfr{position:relative;width:220px;margin:16px auto 22px;border:3px solid var(--ink);border-radius:10px;padding:9px;background:#FFFBF1;box-shadow:6px 6px 0 var(--ink);rotate:-3deg}
.lfr .pic{aspect-ratio:4/5;border:2px solid var(--ink);border-radius:4px;overflow:hidden}
.lfr .pic img{position:relative;height:124%;top:-12%}
.lfr .num{position:absolute;z-index:1;left:-14px;top:-14px;width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:var(--pink);color:#fff;display:grid;place-items:center;font:400 18px 'Alfa Slab One'}
.lfr .t{margin-top:7px;font:400 18px 'Alfa Slab One'}
.hero h1{font:400 clamp(54px,8vw,72px)/1 'Alfa Slab One';color:var(--ink);text-shadow:3px 3px 0 var(--yellow),6px 6px 0 var(--pink)}
.hero h1 .pac{display:block;font-size:36px;color:var(--teal);text-shadow:none;margin:6px 0}
.chips{display:flex;justify-content:center;gap:8px;margin-top:20px}
.chips span{padding:8px 14px;border:2.5px solid var(--ink);border-radius:999px;font:900 14px Nunito;color:#fff;box-shadow:3px 3px 0 var(--ink)}
.hero .msg{margin-top:14px;font-size:20px;color:var(--blue)}
.conffall{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.conffall i{position:absolute;top:-14px;width:7px;height:11px;background:var(--c);opacity:.9;animation:cFall var(--du) linear var(--de) infinite}
@keyframes cFall{0%{transform:translate(0,0) rotate(0) rotateY(0)}50%{transform:translate(22px,380px) rotate(200deg) rotateY(180deg)}100%{transform:translate(-12px,800px) rotate(420deg) rotateY(360deg)}}
.hero .in-w>*{position:relative}
.cards3{display:flex;flex-wrap:wrap;justify-content:center;gap:16px 0;margin:30px 0 6px}
.mini{position:relative;width:118px;border:2.5px solid var(--ink);border-radius:8px;padding:6px;background:#FFFBF1;box-shadow:4px 4px 0 var(--ink);margin:0 -8px}
.cards3 .mini:nth-child(3n+1){rotate:-8deg}.cards3 .mini:nth-child(3n+2){rotate:2deg;z-index:1;translate:0 -10px}.cards3 .mini:nth-child(3n){rotate:9deg}
.mini .pic{aspect-ratio:3/4;border:2px solid var(--ink);border-radius:3px;overflow:hidden}
.mini .n{position:absolute;z-index:1;left:9px;top:8px;background:#FFFBF1;border:2px solid var(--ink);border-radius:4px;padding:0 4px;font:400 12px 'Alfa Slab One'}
.mini .t{font:400 12px 'Alfa Slab One';margin-top:5px;letter-spacing:.03em}
.dark{background-color:var(--ink);background-image:var(--grain);background-blend-mode:multiply;color:#FFF3DF}
.dark h2{color:var(--yellow);text-shadow:3px 3px 0 var(--pink)}
.tabla{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:26px auto 0;max-width:440px}
.tabla>div{position:relative;border:2.5px solid #FFF3DF;border-radius:8px;padding:14px 0 10px;box-shadow:3px 3px 0 #0006}
.tabla>div:nth-child(1){background:var(--pink)}.tabla>div:nth-child(2){background:var(--orange)}.tabla>div:nth-child(3){background:var(--teal)}.tabla>div:nth-child(4){background:var(--blue)}
.tabla>div::after{content:"";position:absolute;right:5px;top:5px;width:11px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#A9714A,#6B3F22);rotate:-20deg}
.tabla b{display:block;font:400 30px 'Alfa Slab One';font-variant-numeric:tabular-nums}
.tabla span{font:900 9px Nunito;letter-spacing:.16em;text-transform:uppercase}
.cinta{position:relative;z-index:1;overflow:hidden;margin:6px -12px;padding:10px 0;background:var(--pink);border-top:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);rotate:-2.5deg;box-shadow:0 4px 0 var(--ink)}
.cinta>div{display:inline-flex;white-space:nowrap;font:400 18px 'Alfa Slab One',serif;color:#fff;letter-spacing:.04em;animation:marq 16s linear infinite}
.cinta>div>span{margin-right:18px}
.cinta>div>span:nth-child(2n){color:var(--yellow)}
@keyframes marq{to{transform:translateX(-50%)}}
.tickets{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.ticket{position:relative;display:flex;gap:14px;align-items:center;text-align:left;border:2.5px solid var(--ink);border-radius:14px;padding:14px;background:#FFFBF1;box-shadow:4px 4px 0 var(--ink)}
.ticket:nth-child(3n+2){background:#FFE9F0}.ticket:nth-child(3n){background:#E3F6F3}
.ticket svg{flex:none;width:58px;height:58px}
.ticket .tm{font:400 18px 'Alfa Slab One';color:var(--pink)}
.ticket h3{font:900 18px Nunito;margin:2px 0}
.sec .ticket p{font-size:14px;line-height:1.5}
.ticket a{display:inline-block;margin-top:6px;font:900 11px Nunito;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:var(--yellow);border:2px solid var(--ink);border-radius:99px;padding:5px 11px;text-decoration:none}
.ticket.in .mg{animation:spin 6s linear infinite}
.mg{transform-box:fill-box;transform-origin:center}
.bigcard{position:relative;border:2.5px solid var(--ink);border-radius:16px;padding:28px 20px;background:#FFFBF1;box-shadow:5px 5px 0 var(--ink);margin-top:16px}
.dots{display:flex;justify-content:center;gap:10px;margin-top:12px}
.dots i{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--ink)}
.lz-content .dots{display:none}
.trav{display:flex;flex-direction:column;gap:16px;margin-top:22px;text-align:left}
.trav>div{display:flex;gap:12px;align-items:flex-start}
.trav .mini{flex:none;width:78px;margin:0;rotate:-3deg}
.trav .mini .art{aspect-ratio:3/4;border:2px solid var(--ink);border-radius:3px;display:grid;place-items:center}
.trav .mini .t{font-size:9px}
.trav h3{font:900 18px Nunito;margin:2px 0 4px}
.sec .trav p{font-size:14.5px;line-height:1.55}
.bubble{position:relative;margin:10px auto 18px;max-width:320px;border:2.5px solid var(--ink);border-radius:26px;padding:24px 20px;background:#fff;box-shadow:5px 5px 0 var(--ink);font:400 22px/1.4 Pacifico,cursive}
.bubble::after{content:"";position:absolute;left:40px;bottom:-18px;width:26px;height:26px;background:#fff;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:skewX(-30deg) rotate(45deg)}
.faq details{margin-top:10px;border:2.5px solid var(--ink);border-radius:16px;background:#FFFBF1;box-shadow:3px 3px 0 var(--ink);text-align:left}
.faq summary{display:flex;justify-content:space-between;gap:10px;padding:15px 16px;font:900 16px Nunito}
.faq summary::after{content:"+";flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;background:var(--yellow);font-weight:900;transition:rotate .3s}
.faq details:nth-child(3n+2) summary::after{background:var(--teal)}.faq details:nth-child(3n) summary::after{background:var(--pink)}
.faq details[open] summary::after{rotate:45deg}
.sec .faq p{padding:0 16px 16px;font-size:15px}
.person{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:12px 0;border-bottom:2px dashed color-mix(in srgb,var(--ink) 20%,transparent);text-align:left}
.person span{font:900 17px Nunito}
.person>div{display:flex;gap:8px;flex-wrap:wrap}
.person button{min-height:40px;padding:8px 15px;border:2px solid var(--ink);border-radius:99px;background:#fff;font:900 13px Nunito;color:var(--ink);cursor:pointer}
.person button[aria-pressed=true]{background:var(--teal);color:#fff;box-shadow:2px 2px 0 var(--ink)}
.person button.no[aria-pressed=true]{background:var(--pink)}
label{display:block;text-align:left;font:900 13px Nunito;margin-top:16px}
textarea{width:100%;margin-top:6px;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:10px;font:400 15px Nunito;color:var(--ink);resize:none}
.rs-err{margin-top:14px;font-weight:800;color:var(--red)}
.sent{display:inline-block;margin-top:6px;padding:8px 16px;border:2.5px solid var(--ink);border-radius:8px;background:var(--teal);color:#fff;font:400 20px 'Alfa Slab One';rotate:-6deg;box-shadow:3px 3px 0 var(--ink);animation:stampIn .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes stampIn{from{transform:scale(2.4) rotate(-20deg);opacity:0}}
footer{position:relative;padding:96px 20px 120px;text-align:center}
footer>.picado{position:absolute;left:0;right:0;top:0}

/* ---------- Movimiento ---------- */
[data-rv]{opacity:0;transform:translateY(26px);transition:opacity .9s ease,transform 1s cubic-bezier(.22,1,.36,1)}
[data-rv=left]{transform:translateX(-60px) rotate(-8deg)}
[data-rv=right]{transform:translateX(60px) rotate(8deg)}
[data-rv=pop]{transform:scale(.5) rotate(-8deg);transition:opacity .4s,transform .7s cubic-bezier(.3,1.6,.5,1)}
[data-rv].in,.lz-editor [data-rv]{opacity:1;transform:none}
@media (min-width:700px){.sec{padding-left:40px;padding-right:40px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}[data-rv]{opacity:1;transform:none}.conffall{display:none}}
</style>

    '<section class="sec papel" id="rsvp" data-lz-anchor="rsvp" style="padding-top:10px"><div class="in-w"><p class="eb" data-lz-if="rsvpDeadline">' + S.limit + ' <span data-lz-date="' + S.rsvpDatePat + '" data-lz-from="rsvpDeadline">' + S.deadline + '</span></p><h2>' + S.rsvpT + '</h2>' +
      '<div class="bigcard" data-rv style="text-align:left"><p class="slab" style="font-size:25px;text-align:center">' + S.guest + '</p><p style="text-align:center;font-weight:800;color:var(--pink)">' + S.seatsRes + '</p>' +
        '<div id="rsForm"><p style="margin:12px 0 4px" data-lz="rsvpMsg">' + S.rsvpMsg + '</p><div id="people"></div>' +
          '<label data-lz-show="rsvpDiet">' + S.diet + '<textarea rows="2"></textarea></label><label data-lz-show="rsvpNote">' + S.note + '<textarea rows="2" id="note"></textarea></label>' +
          '<p class="rs-err" id="rsErr" role="alert" hidden>' + S.err + '</p>' +
          '<div style="text-align:center;margin-top:20px"><button type="button" class="btn" id="rsSave">' + S.save + '</button></div></div>' +
        '<div id="rsDone" hidden style="text-align:center;padding-top:14px"><span class="sent">' + S.sent + '</span><p id="rsSum" style="margin:14px 0 4px"></p><button type="button" class="btn" style="margin-top:12px" id="rsEdit">' + S.edit + '</button></div>' +
      '</div></div></section>' +

    '<footer class="papel">' + picado(18, '', 4) + '<p class="slab" style="font-size:36px;text-shadow:3px 3px 0 var(--yellow)">' + N('n1') + ' &amp; ' + N('n2') + '</p><p class="eb" style="margin-top:8px;color:var(--ink)"><span data-lz-date="{dd}.{mm}.{Y}">14.03.2027</span> · <span data-lz="city">' + S.city + '</span></p></footer>' +
  '</main>';

  document.getElementById('demoBar').innerHTML = '<span class="lbl">' + S.demo + '</span><button type="button" data-open-panel>' + S.panel + '</button><a href="' + S.storeUrl + '">' + S.store + '</a>';
})();
</script>
<script src="/demo/shared/content.js"></script>
<script src="/demo/shared/panel.js"></script>
<script>
(function () {
  var S = window.FiestaS, $ = function (id) { return document.getElementById(id); };
  var PEOPLE = ['Carlos Rodríguez', 'Lucía Pérez', 'Sofía Rodríguez', 'Mateo Rodríguez'];
  LazoPanel.init({ mono: 'A&L', couple: S.n1 + ' ' + S.y + ' ' + S.n2, link: location.pathname, guest: S.guest, people: PEOPLE });
  LazoMusic.init({ src: '/assets/musica/demo.mp3' });
  var COLS = ['#E8457C', '#F28C28', '#F6C343', '#19A39A', '#3B5BDB', '#57A639'];
  var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Cartas de lotería de la galería con su número y nombre (también cuando el editor cambia la galería).
  function captions() { document.querySelectorAll('.cards3 .mini').forEach(function (el, i) { var c = S.caps[i % S.caps.length]; el.querySelector('.n').textContent = c[0]; el.querySelector('.t').textContent = c[1]; }); }

  // Lo que aparece al llegar a la pantalla (después de abrir la invitación).
  var io = null;
  function observe(root) { if (io) root.querySelectorAll('[data-rv]:not(.in)').forEach(function (el) { if (!el.closest('.opening')) io.observe(el); }); }
  function watch() {
    if (io) return;
    if (!('IntersectionObserver' in window)) { document.querySelectorAll('#invite [data-rv]').forEach(function (el) { el.classList.add('in'); }); return; }
    io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }); }, { threshold: .18 });
    observe(document);
  }
  document.addEventListener('lz-render', function (e) { captions(); observe(e.target); });
  captions();

  function burst(x, y, n) {
    if (still) return;
    for (var i = 0; i < n; i++) {
      var p = document.createElement('i'), a = Math.random() * Math.PI * 2, d = 80 + Math.random() * 210, w = 5 + Math.random() * 6, dx = Math.cos(a) * d, dy = Math.sin(a) * d;
      p.className = 'conf'; p.style.cssText = 'left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + (w * (Math.random() < .5 ? 2 : 1)).toFixed(1) + 'px;background:' + COLS[i % COLS.length] + ';' + (Math.random() < .3 ? 'border-radius:50%' : '');
      document.body.appendChild(p);
      p.animate([{ transform: 'translate(-50%,-50%) rotate(0)', opacity: 1 }, { transform: 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px)) rotate(' + Math.random() * 720 + 'deg)', opacity: 1, offset: .5 }, { transform: 'translate(calc(-50% + ' + dx * 1.1 + 'px), calc(-50% + ' + (dy + 260) + 'px)) rotate(' + Math.random() * 1080 + 'deg)', opacity: 0 }], { duration: 1700 + Math.random() * 900, easing: 'cubic-bezier(.2,.7,.3,1)' }).onfinish = (function (n) { return function () { n.remove(); }; })(p);
    }
  }

  // Barra con los nombres al bajar, y la foto de portada que se mueve más lento (profundidad).
  var bar = $('mbar'), img = $('heroImg'), raf = 0, opened = false;
  window.addEventListener('scroll', function () {
    if (raf) return;
    raf = requestAnimationFrame(function () { raf = 0; var y = window.pageYOffset; bar.classList.toggle('show', opened && y > 520); if (y < 900) img.style.translate = '0 ' + Math.min(y * .07, img.parentNode.clientHeight * .12).toFixed(1) + 'px'; });
  }, { passive: true });

  // Apertura: la carta de lotería se voltea; al entrar, el papel picado se levanta y estalla el confeti.
  var op = $('open'), card = $('card'), hint = $('hint'), timer = null;
  function flip() { if (card.classList.contains('flip')) return; LazoMusic.play(); card.classList.add('flip'); hint.textContent = S.loteria; $('enter').tabIndex = 0; card.removeAttribute('role'); card.removeAttribute('tabindex'); }
  card.addEventListener('click', function (e) { if (e.target.closest('#enter')) return; flip(); });
  card.addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ') && !card.classList.contains('flip')) { e.preventDefault(); flip(); $('enter').focus({ preventScroll: true }); } });
  function enter() { clearTimeout(timer); opened = true; op.classList.add('gone'); document.body.classList.remove('locked'); setTimeout(watch, 350); }
  $('enter').addEventListener('click', function () {
    var r = this.getBoundingClientRect();
    op.classList.add('party'); burst(r.left + r.width / 2, r.top, 70);
    timer = setTimeout(function () { enter(); $('demoBar').hidden = false; window.scrollTo(0, 0); }, 900);
  });

  // Para el editor de Lazo (demo/shared/content.js): saltar o volver a mostrar la carta.
  window.LzTemplate = {
    open: function () { card.classList.add('flip'); enter(); },
    envelope: function () { clearTimeout(timer); opened = false; bar.classList.remove('show'); card.classList.remove('flip'); card.setAttribute('role', 'button'); card.tabIndex = 0; $('enter').tabIndex = -1; hint.textContent = S.hint; op.classList.remove('gone', 'party'); document.body.classList.add('locked'); window.scrollTo(0, 0); },
    scroll: function (el, now) { window.scrollTo({ top: el.getBoundingClientRect().top + window.pageYOffset - 70, behavior: now ? 'instant' : 'smooth' }); }
  };

  // Cuenta regresiva en la tabla: cada número salta como un frijolito al cambiar.
  var TARGET = new Date(2027, 2, 14, 13, 0).getTime(), pad = function (n) { return String(n).padStart(2, '0'); }, cd = {};
  document.querySelectorAll('[data-cd]').forEach(function (e) { cd[e.dataset.cd] = e; });
  function set(el, t) { if (el.textContent === t) return; if (!still && el.textContent !== '--' && el.animate) el.animate([{ transform: 'scale(1.5) rotate(-8deg)' }, { transform: 'none' }], { duration: 420, easing: 'cubic-bezier(.3,1.6,.5,1)' }); el.textContent = t; }
  function tick() { var s = Math.floor(Math.max(0, (window.LZ_T || TARGET) - Date.now()) / 1000); set(cd.d, pad(Math.floor(s / 86400))); set(cd.h, pad(Math.floor(s / 3600) % 24)); set(cd.m, pad(Math.floor(s / 60) % 60)); set(cd.s, pad(s % 60)); }
  tick(); setInterval(tick, 1000);

  // Confirmación por persona (demo: no se envía a ningún lado); al confirmar estalla el confeti.
  var att = PEOPLE.map(function () { return null; }), wrap = $('people');
  PEOPLE.forEach(function (name, i) {
    var row = document.createElement('div'); row.className = 'person'; row.setAttribute('role', 'group'); row.setAttribute('aria-label', name);
    var n = document.createElement('span'); n.textContent = name;
    var g = document.createElement('div');
    [[S.yes, true], [S.no, false]].forEach(function (o) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = o[0]; b.setAttribute('aria-pressed', 'false'); if (!o[1]) b.className = 'no';
      b.addEventListener('click', function () { att[i] = o[1]; g.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); $('rsErr').hidden = true; });
      g.appendChild(b);
    });
    row.appendChild(n); row.appendChild(g); wrap.appendChild(row);
  });
  $('rsSave').addEventListener('click', function () {
    if (att.some(function (x) { return x === null; })) { $('rsErr').hidden = false; return; }
    var r = this.getBoundingClientRect(); burst(r.left + r.width / 2, r.top, 60);
    $('rsSum').textContent = S.will(att.filter(Boolean).length, PEOPLE.length);
    $('rsForm').hidden = true; $('rsDone').hidden = false;
    LazoPanel.setResponse(att, $('note').value.trim());
  });
  $('rsEdit').addEventListener('click', function () { $('rsDone').hidden = true; $('rsForm').hidden = false; });
})();
</script>
</body>
</html>
